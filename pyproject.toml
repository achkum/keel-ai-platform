[project]
name = "keel-workspace"
version = "0.0.0"
description = "Workspace root for the Keel monorepo. Not published."
requires-python = ">=3.12"
dependencies = ["keel-core", "keel-cli", "keel-local", "keel-eval"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
keel-core = { workspace = true }
keel-cli = { workspace = true }
keel-local = { workspace = true }
keel-eval = { workspace = true }

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages/keel-core/src", "packages/keel-cli/src", "packages/keel-local/src", "packages/keel-eval/src"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "RUF",      # ruff-specific
    "PTH",      # use pathlib
    "S",        # bandit security checks
    "C4",       # comprehensions
    "N",        # naming
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]  # assert is how pytest works

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = [
    "packages/keel-core/src",
    "packages/keel-cli/src",
    "packages/keel-local/src",
    "packages/keel-eval/src",
]
packages = ["keel_core", "keel_cli", "keel_local", "keel_eval"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = [
    "packages/keel-core/tests",
    "packages/keel-cli/tests",
    "packages/keel-local/tests",
    "packages/keel-eval/tests",
]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["keel_core", "keel_cli", "keel_local", "keel_eval"]
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
