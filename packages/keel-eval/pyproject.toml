[project]
name = "keel-eval"
version = "0.1.0.dev0"
description = "Keel eval gate: quality, attack and load suites, promotion and rollback."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Achyuth Kumar Baddela" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = ["keel-core", "keel-local"]

[tool.uv.sources]
keel-core = { workspace = true }
keel-local = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/keel_eval"]
