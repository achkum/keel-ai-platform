[project]
name = "keel-local"
version = "0.1.0.dev0"
description = "Keel local mode: in-process adapters for all eight layers and the composition root."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Achyuth Kumar Baddela" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = ["keel-core"]

[project.optional-dependencies]
litellm = ["litellm>=1.50"]

[tool.uv.sources]
keel-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/keel_local"]
