# Keel spec. The format is provisional (keel/v0).
# Docs: https://github.com/achkum/keel-ai-platform
keel: keel/v0

app:
  name: my-app
  version: 0.1.0

profile: strict

# "keel/extractive" runs with no API key: it answers from retrieved text only.
# To use a real model, switch to for example:
#   provider: openai
#   name: gpt-4o-mini
# and run `keel eval keel.yaml` (without --offline) with OPENAI_API_KEY set.
model:
  provider: keel
  name: extractive

system_prompt:
  template: prompts/system.md

rag:
  sources:
    - name: docs
      uri: file://docs

access:
  default: deny
  roles:
    - name: reader
      sources: [docs]

guardrails:
  input: [prompt_injection, pii]
  output: [pii]

evals:
  quality:
    - name: smoke
      dataset: evals/quality.jsonl
      min_score: 0.8
  attack:
    - name: injection
      dataset: evals/attack.jsonl
      max_failures: 0
