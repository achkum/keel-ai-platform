name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, type check and test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked --python ${{ matrix.python }}

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest --cov --cov-report=term

      - name: Validate example specs
        run: uv run python -c "from pathlib import Path; from keel_core import load_spec; [load_spec(p) for p in Path('examples').rglob('keel.yaml')]"

      - name: Run the gate offline and audit each example
        run: |
          for spec in examples/*/keel.yaml; do
            uv run keel eval "$spec" --offline
            uv run keel audit "$spec"
          done
